name: Build GenkoNotes

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses and install SDK 37
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "platform-tools" || echo "sdk install fallback"
          sdkmanager --list_installed || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-key-prefix: 'gradle-${{ github.sha }}'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon --warning-mode all
      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace --no-daemon --warning-mode all
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: genkonotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    # Secrets are absent on forks — release only signs on direct pushes.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses and install SDK 37
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "platform-tools" || echo "sdk install fallback"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-key-prefix: 'gradle-${{ github.sha }}'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true
      - name: Restore release keystore
        run: echo "${{ secrets.GENKO_KEYSTORE_BASE64 }}" | base64 -d > app/genko-release.jks
      - name: Assemble R8 release
        env:
          GENKO_KEYSTORE_PASSWORD: ${{ secrets.GENKO_KEYSTORE_PASSWORD }}
          GENKO_KEY_ALIAS: ${{ secrets.GENKO_KEY_ALIAS }}
          GENKO_KEY_PASSWORD: ${{ secrets.GENKO_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon --warning-mode all
      - name: Release APK size
        run: |
          ls -la app/build/outputs/apk/release/
          stat -c '%n %s bytes' app/build/outputs/apk/release/*.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: genkonotes-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: genkonotes-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
